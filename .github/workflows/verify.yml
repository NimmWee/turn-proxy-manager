name: Verify local foundation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  baseline-and-manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned API and verification dependencies
        run: python3 -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Build the static panel outside the VPS
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Check preserved source and runtime hashes
        run: |
          python3 scripts/verify_baseline.py
          python3 vendor/vps/scripts/verify-package.py
      - name: Run original baseline tests
        run: python3 -m unittest discover -s vendor/vps/tests -v
      - name: Run Manager tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh vendor/vps/install.sh vendor/vps/scripts/build-freeturn.sh
      - name: Offline Linux binary smoke
        run: python3 scripts/smoke_baseline.py
